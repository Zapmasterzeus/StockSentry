services:
  # Backend Service
  - type: web
    name: stocksentry-backend
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GOOGLE_GENAI_USE_VERTEXAI
        value: FALSE
      # Add these secrets manually in Render Dashboard after deployment
      - key: GOOGLE_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false

  # Frontend Service
  - type: web
    name: stocksentry-frontend
    runtime: node
    region: oregon
    rootDir: frontend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: BACKEND_URL
        fromService:
          type: web
          name: stocksentry-backend
          property: host